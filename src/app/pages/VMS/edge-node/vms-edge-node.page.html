<ion-header>
	<ion-toolbar>
		<ion-buttons slot="start"><ion-menu-button></ion-menu-button></ion-buttons>
		<ion-title>ERP-Edge nodes</ion-title>
	</ion-toolbar>
</ion-header>

<ion-content>
	<ion-refresher slot="fixed" (ionRefresh)="reload($event)">
		<ion-refresher-content></ion-refresher-content>
	</ion-refresher>
	<ion-list>
		<ion-item *ngFor="let n of items">
			<ion-icon slot="start" [name]="isOnline(n) ? 'checkmark-circle' : 'warning'" [color]="isOnline(n) ? 'success' : 'warning'"></ion-icon>
			<ion-label>
				<h2>{{ n.Name || n.EdgeNodeId }}</h2>
				<p>HB {{ n.LastHeartbeat | date:'short' }} · outbox {{ n.OutboxPending }}</p>
				<p>config {{ n.ConfigVersion }} · gallery {{ n.GalleryVersion }}</p>
			</ion-label>
		</ion-item>
		<ion-item *ngIf="!items?.length"><ion-label color="medium">No edge heartbeats yet</ion-label></ion-item>
	</ion-list>
</ion-content>
