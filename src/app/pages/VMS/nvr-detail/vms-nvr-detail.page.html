<ion-header [translucent]="true">
	<app-toolbar [page]="this">
		<ion-button
			*ngIf="item?.Id && pageConfig.canEdit !== false"
			title="{{ 'Scan cameras' | translate }}"
			(click)="scanChannels()"
		>
			<ion-icon slot="icon-only" name="scan-outline"></ion-icon>
		</ion-button>
		<ion-button
			*ngIf="pageConfig.canEdit !== false && selectedCameras.length"
			title="{{ (bulkNextInUse() ? 'In use' : 'Stop using') | translate }}"
			(click)="bulkToggleInUse($event)"
		>
			<ion-icon
				slot="icon-only"
				[color]="bulkNextInUse() ? 'medium' : 'success'"
				[name]="bulkNextInUse() ? 'ellipse-outline' : 'checkmark-circle'"
			></ion-icon>
		</ion-button>
	</app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="ion-padding">
	<div id="vms-nvr-detail-page" style="position: absolute; z-index: 30005"></div>
	<div class="main-view" *ngIf="item && pageConfig.showSpinner == false">
		<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

		<ion-grid fixed>
			<form [formGroup]="formGroup">
				<ion-row class="hr-group">
					<ion-col size="12" size-sm="12" size-md="12" size-xl="3">
						<ion-list-header class="ion-no-padding">
							<ion-label color="primary">{{ 'NVR' | translate }}</ion-label>
						</ion-list-header>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control [field]="{ id: 'Id', label: 'Id', type: 'number', form: formGroup }"></app-form-control>
						<app-form-control
							[field]="{
								id: 'IDBranch',
								label: 'Branch',
								type: 'ng-select-branch',
								dataSource: branchList,
								bindLabel: 'Name',
								bindValue: 'Id',
								form: formGroup,
								appendTo: '#vms-nvr-detail-page',
								branchConfig: { selectedBranch: env.selectedBranch }
							}"
							(change)="saveChange()"
						></app-form-control>
						<app-form-control [field]="{ id: 'Code', label: 'Code', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control [field]="{ id: 'Name', label: 'Name', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control [field]="{ id: 'Host', label: 'Host', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control [field]="{ id: 'HostWan', label: 'Host WAN (optional)', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control
							[field]="{ id: 'Port', label: 'Port', type: 'number', mask: '99999', thousandSeparator: '', form: formGroup }"
							(change)="saveChange()"
						></app-form-control>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control [field]="{ id: 'Vendor', label: 'Vendor', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control [field]="{ id: 'Username', label: 'Username', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
						<app-form-control
							[field]="{ id: 'PasswordEnc', label: 'Password', type: showPassword ? 'text' : 'password', form: formGroup }"
							(change)="saveChange()"
						>
							<a label="" class="show-password" (click)="toggleShowPassword($event)">
								<ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
							</a>
						</app-form-control>
						<app-form-control [field]="{ id: 'Protocol', label: 'Protocol', type: 'text', form: formGroup }" (change)="saveChange()"></app-form-control>
					</ion-col>
				</ion-row>

				<ion-row class="hr-group" *ngIf="item.Id">
					<ion-col size="12" size-sm="12" size-md="12" size-xl="3">
						<ion-list-header class="ion-no-padding">
							<ion-label color="primary">{{ 'Available cameras' | translate }}</ion-label>
						</ion-list-header>
					</ion-col>
					<ion-col size="12" size-sm size-xl="8">
						<app-data-table
							class="box-shadow responsive"
							[rows]="cameras"
							[trackBy]="'_rowKey'"
							[(selectedRows)]="selectedCameras"
							[showSpinner]="false"
							[isQueryLocalOnly]="true"
						>
							<datatable-empty-message>
								<ng-template datatable-empty-message-template>
									{{ 'No cameras on this NVR' | translate }}
								</ng-template>
							</datatable-empty-message>
							<datatable-column [checkbox]="true" name="" [canSort]="false" [canFilter]="false">
								<ng-template datatable-header-template>
									<input
										class="c-checkbox"
										type="checkbox"
										[checked]="allCamerasSelected()"
										[attr.title]="(allCamerasSelected() ? 'Unselect all' : 'Select all') | translate"
										(change)="toggleSelectAllCameras($event)"
									/>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-number col-ch" name="Channel" property="ChannelNo">
								<ng-template let-i="row" datatable-cell-template>
									<span *ngIf="i.ChannelNo != null">CH{{ i.ChannelNo }}</span>
									<span *ngIf="i.ChannelNo == null">—</span>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-name flex-break" name="Name" property="Name"></datatable-column>
							<datatable-column class="col-status" name="Status" property="online">
								<ng-template let-i="row" datatable-cell-template>
									<span class="hb">
										<span class="dot" [class.on]="i.online" [class.off]="!i.online"></span>
										{{ (i.online ? 'Online' : 'Offline') | translate }}
									</span>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-icon" name="" property="IsDisabled" [canSort]="false" [canFilter]="false">
								<ng-template let-i="row" datatable-cell-template>
									<ion-icon
										class="min-btn clickable"
										[class.disabled]="pageConfig.canEdit === false"
										[color]="inUse(i) ? 'success' : 'medium'"
										[name]="inUse(i) ? 'checkmark-circle' : 'ellipse-outline'"
										[attr.title]="(inUse(i) ? 'In use' : 'Not in use') | translate"
										(click)="toggleInUse(i, $event)"
									></ion-icon>
								</ng-template>
							</datatable-column>
							<datatable-column class="col-icon" name="" property="Id" [canSort]="false" [canFilter]="false">
								<ng-template let-i="row" datatable-cell-template>
									<ion-icon
										*ngIf="pageConfig.canEdit !== false && savedInDb(i)"
										color="danger"
										class="min-btn clickable"
										name="trash-outline"
										[attr.title]="'Remove' | translate"
										(click)="removeCamera(i, $event)"
									></ion-icon>
								</ng-template>
							</datatable-column>
						</app-data-table>
					</ion-col>
				</ion-row>

				<ion-row class="hr-group" *ngIf="item.Id">
					<ion-col size="12" size-sm="12" size-md="12" size-xl="3">
						<ion-list-header class="ion-no-padding">
							<ion-label color="primary">{{ 'Other information' | translate }}</ion-label>
						</ion-list-header>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control [field]="{ id: 'CreatedBy', type: 'text', label: 'Created by', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'CreatedDate', type: 'span-datetime', label: 'Created date', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'ModifiedBy', type: 'text', label: 'Last modified by', form: formGroup }"></app-form-control>
						<app-form-control [field]="{ id: 'ModifiedDate', type: 'span-datetime', label: 'Last modified date', form: formGroup }"></app-form-control>
					</ion-col>
					<ion-col size="12" size-sm size-xl="4">
						<app-form-control
							[field]="{ id: 'IDBranch', type: 'branch-breadcrumbs', label: 'Branch', form: formGroup, dataSource: env.branchList }"
						></app-form-control>
						<app-form-control [field]="{ id: 'Remark', label: 'Remark', type: 'textarea', form: formGroup }" (change)="saveChange()"></app-form-control>
					</ion-col>
				</ion-row>
			</form>
		</ion-grid>
	</div>
	<app-page-message [itemsLength]="item ? 1 : 0" [showSpinner]="pageConfig.showSpinner"></app-page-message>
</ion-content>
