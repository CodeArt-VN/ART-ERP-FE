<ion-header>
	<ion-toolbar>
		<ion-buttons slot="start">
			<ion-menu-button></ion-menu-button>
		</ion-buttons>
		<ion-title>VMS Cameras / NVR</ion-title>
		<ion-buttons slot="end">
			<ion-button (click)="addNvr()">NVR</ion-button>
			<ion-button (click)="addCamera()">Camera</ion-button>
		</ion-buttons>
	</ion-toolbar>
</ion-header>

<ion-content>
	<ion-refresher slot="fixed" (ionRefresh)="reload($event)">
		<ion-refresher-content></ion-refresher-content>
	</ion-refresher>

	<ion-list-header>NVR</ion-list-header>
	<ion-list>
		<ion-item *ngFor="let n of nvrs">
			<ion-label>
				<h2>{{ n.Name }}</h2>
				<p>{{ n.Host }}:{{ n.Port }} · {{ n.Vendor }}</p>
			</ion-label>
		</ion-item>
		<ion-item *ngIf="!nvrs?.length"><ion-label color="medium">No NVR</ion-label></ion-item>
	</ion-list>

	<ion-list-header>Cameras</ion-list-header>
	<ion-list>
		<ion-item *ngFor="let c of cameras" [routerLink]="['/vms-permission']" [queryParams]="{ id: c.Id }">
			<ion-label>
				<h2>{{ c.Name }} ({{ c.CameraCode }})</h2>
				<p>Role {{ c.Role }} · AI {{ c.AiEnabled ? 'ON' : 'OFF' }}</p>
			</ion-label>
			<ion-badge slot="end" color="primary">{{ c.Role }}</ion-badge>
		</ion-item>
		<ion-item *ngIf="!cameras?.length"><ion-label color="medium">No cameras (ACL may hide all)</ion-label></ion-item>
	</ion-list>
</ion-content>
