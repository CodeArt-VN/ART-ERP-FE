<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left" forceOverscroll="false">
	<ion-refresher [disabled]="!pageConfig.refresher" slot="fixed" (ionRefresh)="refresh($event)">
		<ion-refresher-content></ion-refresher-content>
	</ion-refresher>

	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive padding-number-right"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-name flex-break" name="Name" property="Name">
				<ng-template let-i="row" datatable-cell-template>
					<div [routerLink]="['/' + pageConfig.pageName + '/' + i.Id]">
						<a class="bold">
							<ion-text color="dark">{{ i.Name }}</ion-text>
						</a>
						<div class="cam-meta">#{{ i.Id }} · {{ i.Code }}</div>
						<div class="cam-meta">{{ i.BranchName }}</div>
						<small *ngIf="fromNvr(i)" class="nvr-tag">{{ 'NVR' | translate }}</small>
					</div>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-role" name="Role" property="Role" filterControlType="ng-select" [filterDataSource]="roleList">
				<ng-template let-i="row" datatable-cell-template>
					<div class="role-cell">
						<ion-badge color="primary">{{ i.Role }}</ion-badge>
						<ion-text [color]="i.AiEnabled ? 'success' : 'medium'">{{ (i.AiEnabled ? 'AI ON' : 'AI OFF') | translate }}</ion-text>
					</div>
				</ng-template>
			</datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
