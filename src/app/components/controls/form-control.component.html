<div class="c-control" [ngClass]="{'inline-control': inline === true, 'history-changed': historyService.active && id && historyService.changedHeaderFields.has(id) }" >
	<label class="c-label" [attr.for]="id" *ngIf="type != 'checkbox' && type != 'radio' && label">
		{{ label | translate }}
		<ng-content select="[label]"></ng-content>
		<ion-text *ngIf="form?.controls?.[id] && !form.controls[id].valid && !form.controls[id].pending && form.controls[id].dirty" color="danger"
			>(*<ng-content select="[message]"></ng-content>)</ion-text
		>
	</label>
	<app-input-control
		*ngIf="field && showInput"
		[field]="field"
		[inputControlTemplate]="inputControlTemplate"
		[clearable]="clearable ?? field?.clearable"
		[virtualScroll]="virtualScroll ?? field?.virtualScroll"
		(change)="onChange($event)"
		(inputChange)="onInputChange($event)"
		(nav)="onNav($event)"
	></app-input-control>
	<ng-content select="[control]"></ng-content>
	<label class="c-label checkbox" [attr.for]="id" *ngIf="type == 'checkbox' && label">
		{{ label | translate }}
		<ng-content select="[label]"></ng-content>
		<ion-text *ngIf="form?.controls?.[id] && !form.controls[id].valid && !form.controls[id].pending && form.controls[id].dirty" color="danger"
			>(*<ng-content select="[message]"></ng-content>)</ion-text
		>
	</label>
</div>
